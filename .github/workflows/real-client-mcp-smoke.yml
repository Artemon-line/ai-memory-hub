name: real-client-mcp-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-client-mcp-smoke:
    name: Real-Client MCP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run real-client MCP smoke harness
        env:
          PYTHONHASHSEED: '0'
        run: >
          uv run python -m memory.tools.real_client_smoke
          --artifact-dir artifacts/real-client-mcp-smoke

      - name: Upload real-client smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: real-client-mcp-smoke
          path: artifacts/real-client-mcp-smoke
          if-no-files-found: warn
