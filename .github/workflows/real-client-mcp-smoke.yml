name: real-client-mcp-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-client-mcp-smoke:
    name: Real-Client MCP Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run real-client MCP smoke harness
        env:
          PYTHONHASHSEED: '0'
        run: >
          uv run python -m memory.tools.real_client_smoke
          --artifact-dir artifacts/real-client-mcp-smoke

      - name: Upload real-client smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-client-mcp-smoke
          path: artifacts/real-client-mcp-smoke
          if-no-files-found: warn
