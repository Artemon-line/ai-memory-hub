name: bruno-integration

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bruno-integration.yml"
      - "memory/**"
      - "tests/bruno/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: read

jobs:
  bruno-integration:
    name: Bruno API/MCP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: memory
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d memory"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --dev --extra postgres

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: tests/bruno/pnpm-lock.yaml

      - name: Install Bruno CLI
        working-directory: tests/bruno
        run: pnpm install --frozen-lockfile

      - name: Validate Bruno test files
        run: |
          uv run python tests/bruno/validate_files.py
          uv run python -m ruff check tests/bruno/seed_auth.py tests/bruno/validate_files.py

      - name: Start ai-memory-hub
        run: |
          uv run aim serve \
            --config tests/bruno/config.ci.yaml \
            --host 127.0.0.1 \
            --port 8000 \
            > bruno-server.log 2>&1 &
          echo "$!" > bruno-server.pid

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            if curl --max-time 5 -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            if ! kill -0 "$(cat bruno-server.pid)" 2>/dev/null; then
              cat bruno-server.log
              exit 1
            fi
            sleep 2
          done
          cat bruno-server.log
          exit 1

      - name: Run Bruno collection
        working-directory: tests/bruno/collections/ai-memory-hub-integration
        run: |
          mkdir -p ../../reports
          pnpm exec bru run \
            --global-env ci \
            --workspace-path ../.. \
            --tags smoke \
            --env-var run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --reporter-html ../../reports/bruno-integration-report.html \
            --reporter-junit ../../reports/bruno-integration-junit.xml \
            --sandbox developer \
            --noproxy

      - name: Stop unauthenticated ai-memory-hub
        run: |
          if [ -f bruno-server.pid ]; then
            kill "$(cat bruno-server.pid)" 2>/dev/null || true
            rm bruno-server.pid
          fi
          sleep 2

      - name: Verify OAuth resource-server challenge
        run: |
          uv run aim serve \
            --config tests/bruno/config.oauth.ci.yaml \
            --host 127.0.0.1 \
            --port 8010 \
            > bruno-oauth-server.log 2>&1 &
          echo "$!" > bruno-oauth-server.pid
          ready=false
          for i in {1..30}; do
            if curl --max-time 5 -fsS http://127.0.0.1:8010/ready; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat bruno-oauth-server.pid)" 2>/dev/null; then
              cat bruno-oauth-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat bruno-oauth-server.log
            kill "$(cat bruno-oauth-server.pid)" 2>/dev/null || true
            rm bruno-oauth-server.pid
            exit 1
          fi
          challenge_status="$(
            curl --max-time 5 -sS -D /tmp/oauth-challenge.headers \
              -o /tmp/oauth-challenge-body.txt -w "%{http_code}" \
              http://127.0.0.1:8010/mcp
          )"
          test "$challenge_status" = "401"
          grep -F 'resource_metadata="https://memory.example.test/.well-known/oauth-protected-resource/mcp"' \
            /tmp/oauth-challenge.headers
          metadata_status="$(
            curl --max-time 5 -sS -o /tmp/oauth-metadata.json -w "%{http_code}" \
              http://127.0.0.1:8010/.well-known/oauth-protected-resource/mcp
          )"
          test "$metadata_status" = "200"
          kill "$(cat bruno-oauth-server.pid)" 2>/dev/null || true
          rm bruno-oauth-server.pid

      - name: Seed bearer auth users and shared project
        run: uv run python tests/bruno/seed_auth.py

      - name: Start authenticated ai-memory-hub
        run: |
          uv run aim serve \
            --config tests/bruno/config.auth.ci.yaml \
            --host 127.0.0.1 \
            --port 8000 \
            > bruno-auth-server.log 2>&1 &
          echo "$!" > bruno-auth-server.pid

      - name: Wait for authenticated readiness
        run: |
          for i in {1..30}; do
            if curl --max-time 5 -fsS http://127.0.0.1:8000/ready; then
              exit 0
            fi
            if ! kill -0 "$(cat bruno-auth-server.pid)" 2>/dev/null; then
              cat bruno-auth-server.log
              exit 1
            fi
            sleep 2
          done
          cat bruno-auth-server.log
          exit 1

      - name: Run Bruno auth/project collection
        working-directory: tests/bruno/collections/ai-memory-hub-integration
        run: |
          mkdir -p ../../reports
          pnpm exec bru run \
            --global-env ci \
            --workspace-path ../.. \
            --tags auth \
            --env-var run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-auth" \
            --reporter-html ../../reports/bruno-auth-project-report.html \
            --reporter-junit ../../reports/bruno-auth-project-junit.xml \
            --sandbox developer \
            --noproxy

      - name: Publish Bruno test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: >-
          ${{
            always() &&
            hashFiles('tests/bruno/reports/*junit.xml') != '' &&
            (github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository)
          }}
        with:
          files: tests/bruno/reports/*junit.xml
          check_name: Bruno API/MCP Test Results
          comment_mode: off

      - name: Capture server logs
        if: always()
        run: |
          mkdir -p tests/bruno/reports
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "sha=${GITHUB_SHA}"
          } > tests/bruno/reports/diagnostics.txt
          cp bruno-server.log tests/bruno/reports/bruno-server.log || true
          cp bruno-auth-server.log tests/bruno/reports/bruno-auth-server.log || true
          cp bruno-oauth-server.log tests/bruno/reports/bruno-oauth-server.log || true

      - name: Upload Bruno report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bruno-integration-report
          path: tests/bruno/reports
          if-no-files-found: error

      - name: Stop ai-memory-hub
        if: always()
        run: |
          if [ -f bruno-server.pid ]; then
            kill "$(cat bruno-server.pid)" 2>/dev/null || true
          fi
          if [ -f bruno-auth-server.pid ]; then
            kill "$(cat bruno-auth-server.pid)" 2>/dev/null || true
          fi
          if [ -f bruno-oauth-server.pid ]; then
            kill "$(cat bruno-oauth-server.pid)" 2>/dev/null || true
          fi
