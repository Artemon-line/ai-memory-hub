site_name: ai-memory-hub
site_description: Local-first deterministic memory ingestion hub
site_url: https://artemon-line.github.io/ai-memory-hub/
repo_url: https://github.com/Artemon-line/ai-memory-hub
repo_name: Artemon-line/ai-memory-hub
copyright: >
  Dedicated to my little brother,<br>
  Andrii Hladenko.<br>
  Вічна Слава Героям.
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="18" height="14"
       role="img" aria-label="Ukraine flag" style="vertical-align: -2px">
    <title>Ukraine flag</title>
    <path fill="gold" d="M0 0h640v480H0z"/>
    <path fill="#0057b8" d="M0 0h640v240H0z"/>
  </svg>
docs_dir: .docs-build
site_dir: site
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: docs/assets/brand/ai-memory-hub-mark.svg
  favicon: docs/assets/brand/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

plugins:
  - search
  - mike:
      alias_type: redirect
      canonical_version: latest

extra:
  docs_status: !ENV [DOCS_STATUS, release]
  version:
    provider: mike
    default: latest
    alias: true

extra_css:
  - docs/stylesheets/connect.css
  - docs/stylesheets/leap-day-dark.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.0/mermaid.min.js
  - docs/javascripts/mermaid.js
  - docs/javascripts/connect.js

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - What Exists Now:
      - Current Features: docs/features.md
      - Import Conversations: docs/importing_conversations.md
      - Zero-token Import Hooks: docs/import_hooks.md
      - Importer Compatibility: docs/importer_compatibility.md
      - Technical Overview: docs/overview.md
      - Agent Integration: docs/agents.md
      - Connect UI and OAuth Setup: docs/connect_ui.md
      - External OIDC and Keycloak: docs/external_oidc.md
      - Brand Assets: docs/brand_assets.md
      - Storage Provider Examples: docs/storage_provider_examples.md
      - PostgreSQL Driver Decision: docs/postgres_driver_decision.md
      - Observability: docs/observability.md
      - Quality Evaluation: docs/quality_evaluation.md
      - Architecture: docs/architecture.md
  - What Is Planned:
      - Project Status: docs/project_status.md
      - Roadmap: docs/roadmap.md
      - Planned Features: docs/planned_features.md
      - Documentation And Planning: docs/plans.md
  - Project:
      - Changelog: CHANGELOG.md
      - Contributing: CONTRIBUTING.md
      - Code Of Conduct: CODE_OF_CONDUCT.md
      - Security: SECURITY.md
  - Integration Guides:
      - OpenClaw Native MCP Setup: docs/openclaw_native_mcp_setup.md
