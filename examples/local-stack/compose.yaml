services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory
    ports:
      # Keep Postgres local to this host. Remote clients only need the hub API/MCP port.
      - "127.0.0.1:5432:5432"
    volumes:
      - amh_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      # Wait until Postgres accepts connections for the configured user/database.
      test: ["CMD-SHELL", "pg_isready -U memory -d memory"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-exporter:
    image: ghcr.io/prometheus-community/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://memory:memory@postgres:5432/memory?sslmode=disable
    ports:
      # Optional raw exporter endpoint for local debugging; Prometheus scrapes it
      # over the Compose network.
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy

  ai-memory-hub:
    build:
      context: ../..
      dockerfile: examples/local-stack/Containerfile.oauth
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AMH_OAUTH_JWT_SECRET: ${AMH_OAUTH_JWT_SECRET:-}
      AMH_SESSION_SECRET: ${AMH_SESSION_SECRET:-}
    extra_hosts:
      # Lets containers reach Ollama on the host through host.docker.internal.
      - "host.docker.internal:host-gateway"
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      # Keep the hub on loopback. Use ngrok, a reverse proxy, VPN, or another
      # protected boundary for remote clients.
      - "127.0.0.1:8000:8000"
    volumes:
      # The :Z suffix makes this bind mount work with rootless Podman on
      # SELinux-enabled hosts. Docker ignores the SELinux relabel option.
      - ./${AMH_CONFIG_FILE:-config.yaml}:/app/config.yaml:ro,Z
      - amh_hub_data:/data
      - amh_hub_logs:/logs
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"
    depends_on:
      jaeger:
        condition: service_started

  jaeger:
    image: quay.io/jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: quay.io/prometheus/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - amh_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      otel-collector:
        condition: service_started

  grafana:
    image: grafana/grafana-oss:12.4.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  amh_pgvector_data:
  amh_hub_data:
  amh_hub_logs:
  amh_prometheus_data:
