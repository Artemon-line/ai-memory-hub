[project]
name = "ai-memory-hub"
version = "1.0.0"
description = "Local-first deterministic memory ingestion hub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=4.1.2",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.25.1",
    "lancedb>=0.40.0",
    "mcp>=2.2.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.2",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
elasticsearch = [
    "elasticsearch>=9.5.1",
]
milvus = [
    "pymilvus>=3.0.2",
]
mongodb = [
    "pymongo>=4.19.0",
]
opensearch = [
    "opensearch-py>=2.7.0",
]
observability = [
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.66b2",
    "opentelemetry-instrumentation-requests>=0.66b1",
    "opentelemetry-instrumentation-dbapi>=0.50b0",
]
oauth = [
    "authlib>=1.9.1",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "joserfc>=1.7.6",
    "python-multipart>=0.0.32",
]
postgres = [
    "pg8000>=1.31.5",
]
pinecone = [
    "pinecone>=7.0.0",
]
qdrant = [
    "qdrant-client>=1.20.0",
]
redis = [
    "redis>=8.1.0",
]
tokenizer = [
    "tiktoken>=0.14.0",
]
turbopuffer = [
    "turbopuffer>=2.9.0",
]
vespa = [
    "pyvespa>=1.2.9",
]
typesense = [
    "typesense>=0.21.0",
]
weaviate = [
    "weaviate-client>=4.23.0",
]

[project.scripts]
aim = "memory.cli:main"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mcp-pytest>=0.1.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
docs = [
    "mike==2.2.0",
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["memory"]

[tool.pyright]
include = ["memory"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
